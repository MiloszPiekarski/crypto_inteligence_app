# pgBackRest staging (roadmapa E3, zakres 5; F-02): pełna kopia tygodniowo, przyrostowa
# codziennie (systemd timer, infra/compose/staging/backup.sh), WAL ciągle (archive_command),
# szyfrowanie AES-256, retencja 30 dni. Repozytorium: bucket R2 goatcash-staging-backups.
# Sekrety i adres konta w zmiennych środowiska z ./env/postgres.env (SOPS), nie w tym pliku:
#   PGBACKREST_REPO1_S3_ENDPOINT, PGBACKREST_REPO1_S3_KEY, PGBACKREST_REPO1_S3_KEY_SECRET,
#   PGBACKREST_REPO1_CIPHER_PASS
# Test w CI (make backup-restore-test) nadpisuje repozytorium na lokalne (posix) zmiennymi.
[global]
repo1-type=s3
repo1-path=/staging
repo1-s3-bucket=goatcash-staging-backups
repo1-s3-region=auto
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=time
repo1-retention-full=30
compress-type=zst
process-max=2
start-fast=y
log-level-console=info
log-level-file=off

[goatcash]
pg1-path=/home/postgres/pgdata/data
