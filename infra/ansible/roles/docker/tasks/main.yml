---
# Docker z oficjalnego repozytorium (roadmapa E3); dane Dockera na wolumenie danych.
- name: Katalog kluczy apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Klucz repozytorium Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Repozytorium Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Katalog konfiguracji Dockera
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Konfiguracja demona (dane na wolumenie, limity logów)
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Pakiety Docker i Compose
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present
    update_cache: true

- name: Docker uruchamiany przy starcie
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Użytkownik deploy w grupie docker (wdrożenia bez sudo)
  ansible.builtin.user:
    name: deploy
    groups: [docker]
    append: true
