---
- name: Pakiety bazowe (aktualizacje bezpieczeństwa, fail2ban, ufw)
  ansible.builtin.apt:
    name:
      [
        unattended-upgrades,
        apt-listchanges,
        fail2ban,
        ufw,
        needrestart,
        curl,
        ca-certificates,
        python3,
        lynis,
      ]
    state: present
    update_cache: true
    cache_valid_time: 3600

# Świeży obraz jest starszy niż poprawki, a unattended-upgrades działa raz na dobę: zaległe
# aktualizacje od razu (Lynis PKGS-7392 „vulnerable packages”, external-scan 45485727014).
- name: Zaległe aktualizacje pakietów
  ansible.builtin.apt:
    upgrade: safe
    update_cache: true
    cache_valid_time: 3600

- name: Czy system wymaga restartu po aktualizacjach
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: base_reboot_required

# Kontenery mają restart: unless-stopped, Tailscale startuje z systemd, więc po restarcie
# serwer wraca sam; Ansible czeka na ponowne połączenie przez Tailscale.
- name: Restart po aktualizacjach (tylko gdy wymagany)
  ansible.builtin.reboot:
    reboot_timeout: 900
    msg: "GoatCash: restart po aktualizacjach bezpieczeństwa (Ansible)"
  when: base_reboot_required.stat.exists
  tags: [reboot] # test w kontenerze pomija restart (--skip-tags reboot)

- name: Automatyczne aktualizacje bezpieczeństwa
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: "0644"

- name: Użytkownik deploy (bez hasła, logowanie tylko kluczem, bez sudo poza jednym skryptem)
  ansible.builtin.user:
    name: deploy
    shell: /bin/bash
    password_lock: true
    create_home: true

# Lynis PKGS-7388 („brak repozytorium bezpieczeństwa”) na arm64 to fałszywy alarm: poprawki
# przychodzą z ports.ubuntu.com (suite <wydanie>-security), a Lynis szuka security.ubuntu.com
# (na amd64 tego ostrzeżenia nie ma; external-scan 45485727014). Wyjątek tylko z dowodem:
# najpierw sprawdzamy, że suite -security jest w źródłach apt, inaczej przebieg pada.
- name: Źródła apt (dowód repozytorium bezpieczeństwa na arm64)
  ansible.builtin.slurp:
    src: /etc/apt/sources.list.d/ubuntu.sources
  register: base_apt_sources
  when: ansible_architecture == 'aarch64'

- name: Repozytorium bezpieczeństwa jest skonfigurowane
  ansible.builtin.assert:
    that: >-
      (base_apt_sources.content | b64decode) is search('(?m)^Suites:.*\\b' ~ ansible_distribution_release ~ '-security\\b')
    fail_msg: "Brak suite {{ ansible_distribution_release }}-security w ubuntu.sources: wyjątek Lynis PKGS-7388 niedozwolony"
    quiet: true
  when: ansible_architecture == 'aarch64'

- name: Profil Lynis (wyjątek PKGS-7388 tylko na arm64, z dowodem wyżej)
  ansible.builtin.copy:
    dest: /etc/lynis/custom.prf
    content: |
      # Zarządzane przez Ansible (roles/base). Uzasadnienie: komentarz w tasks/main.yml.
      skip-test=PKGS-7388
    owner: root
    group: root
    mode: "0644"
  when: ansible_architecture == 'aarch64'

- name: Brak wyjątków Lynis na pozostałych architekturach
  ansible.builtin.file:
    path: /etc/lynis/custom.prf
    state: absent
  when: ansible_architecture != 'aarch64'

- name: Sonda tylko do odczytu (jedyne polecenie klucza goatcash-staging-probe)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop: [goatcash-probe, goatcash-lynis]

- name: Użytkownik deploy może uruchomić przez sudo audyt Lynis
  ansible.builtin.copy:
    dest: /etc/sudoers.d/goatcash-lynis
    content: "deploy ALL=(root) NOPASSWD: /usr/local/bin/goatcash-lynis\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Klucze SSH użytkownika deploy (klucz CI; klucz sondy tylko z wymuszonym poleceniem)
  ansible.posix.authorized_key:
    user: deploy
    key: |-
      {{ lookup('ansible.builtin.file', playbook_dir + '/../ssh/goatcash_staging_ci.pub') }}
      restrict,command="/usr/local/bin/goatcash-probe" {{ lookup('ansible.builtin.file', playbook_dir + '/../ssh/goatcash_staging_probe.pub') }}
    exclusive: true

# `sshd -t` wymaga /run/sshd; przy uruchamianiu SSH na żądanie (ssh.socket, Ubuntu 24.04)
# katalog może nie istnieć, dopóki usługa nie wystartuje.
- name: Katalog separacji uprawnień sshd
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: SSH tylko kluczem, bez roota i haseł
  ansible.builtin.template:
    src: sshd-goatcash.conf.j2
    dest: /etc/ssh/sshd_config.d/10-goatcash.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Fail2ban dla SSH
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/goatcash.local
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      bantime = 1h
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

# Świeży obraz Ubuntu 24.04 w OCI nie ma katalogu journald.conf.d (przebieg 45472289719).
- name: Katalog konfiguracji journald
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Limity journald (rozmiar i czas przechowywania logów)
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/goatcash.conf
    content: |
      [Journal]
      SystemMaxUse=500M
      MaxRetentionSec=14day
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald

- name: Plik wymiany (swap)
  ansible.builtin.command:
    cmd: "fallocate -l {{ swap_size_mb }}M {{ base_swap_file }}"
    creates: "{{ base_swap_file }}"

- name: Uprawnienia pliku wymiany
  ansible.builtin.file:
    path: "{{ base_swap_file }}"
    owner: root
    group: root
    mode: "0600"

# Warunek to „ten plik nie jest aktywny”, a nie „brak swapu w systemie”: inny swap (albo swap
# hosta widoczny w kontenerze testowym) nie może sprawić, że plik zostanie pominięty.
- name: Aktywne pliki wymiany
  ansible.builtin.command:
    cmd: swapon --show=NAME --noheadings
  register: base_swap_active
  changed_when: false
  check_mode: false

- name: Format pliku wymiany (gdy nieaktywny)
  ansible.builtin.command:
    cmd: "mkswap {{ base_swap_file }}"
  register: base_mkswap
  changed_when: base_mkswap.rc == 0
  when: base_swap_file not in base_swap_active.stdout_lines

- name: Włączenie pliku wymiany przy starcie
  ansible.posix.mount:
    path: none
    src: "{{ base_swap_file }}"
    fstype: swap
    opts: sw
    state: present

- name: Włączenie pliku wymiany teraz
  ansible.builtin.command:
    cmd: "swapon {{ base_swap_file }}"
  register: base_swapon
  changed_when: base_swapon.rc == 0
  when: base_swap_file not in base_swap_active.stdout_lines

- name: Niska skłonność do wymiany
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    sysctl_file: /etc/sysctl.d/90-goatcash.conf
    state: present
