---
- name: Restart ssh
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Restart journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted

- name: Przeładowanie timerów apt
  ansible.builtin.systemd_service:
    name: "{{ item }}.timer"
    state: restarted
    daemon_reload: true
  loop: [apt-daily, apt-daily-upgrade]
