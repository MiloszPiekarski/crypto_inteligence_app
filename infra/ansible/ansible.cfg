# Ansible staging (roadmapa E3, zakres prac 3). Uruchamia workflow ansible-staging.yml przez
# Tailscale (D5): połączenia SSH tylko w sieci Tailscale, nazwy hostów z MagicDNS.
[defaults]
inventory = inventory/staging.yml
roles_path = roles
collections_path = collections
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
