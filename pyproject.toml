[[tool.importlinter.contracts]]
name = "executor: tylko bot_core.api i common.api"
type = "forbidden"
# Tu import pośredni też jest zakazany: executor (osobna mikro-VM) nie może dostać
# modułu domenowego „przy okazji”, np. przez bot_core.api, które by go importowało.
allow_indirect_imports = false
source_modules = ["goatcash_executor"]
forbidden_modules = ["goatcash.marketdata", "goatcash.features", "goatcash.agents", "goatcash.fusion", "goatcash.ledger", "goatcash.ml", "goatcash.llm", "goatcash.backtest", "goatcash.alerts", "goatcash.users"]

[[tool.importlinter.contracts]]
name = "platforma nie importuje executora"
