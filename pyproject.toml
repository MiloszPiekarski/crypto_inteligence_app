# Katalog główny monorepo: wirtualny workspace uv (sam nie jest pakietem).
[project]
name = "goatcash-monorepo"
version = "0.0.0"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/platform", "services/executor"]

[tool.uv.sources]
goatcash-platform = { workspace = true }
goatcash-executor = { workspace = true }

[dependency-groups]
dev = [
  "goatcash-platform",
  "goatcash-executor",
  "ruff>=0.17,<0.18",
  "pyright>=1.1.400",
  "pytest>=8.4",
  "pytest-cov>=7.0",
  "hypothesis>=6.140",
  "import-linter>=2.4",
  "pre-commit>=4.3",
  "pyyaml>=6.0",
  "testcontainers>=4.10",
  "jsonschema>=4.25",
  "rfc3339-validator>=0.1.4",
  "httpx>=0.28",
]

# ---------------- ruff (lint + format) ----------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services/platform/src", "services/executor/src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "PT", "C4", "PL"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004"]

# ---------------- pyright ----------------
# Roadmapa E1: „strict dla nowych modułów”. Cały kod repozytorium powstaje od E1,
# więc strict obejmuje wszystko, co jest w `include` (źródła, testy, skrypty).
[tool.pyright]
pythonVersion = "3.12"
include = ["scripts", "services/platform/src", "services/executor/src", "services/platform/tests", "services/executor/tests", "packages/contracts/tests"]
typeCheckingMode = "strict"
extraPaths = ["scripts"]
venvPath = "."
venv = ".venv"

# ---------------- pytest + pokrycie ----------------
[tool.pytest.ini_options]
testpaths = ["services/platform/tests", "services/executor/tests", "scripts/tests", "packages/contracts/tests"]
pythonpath = ["scripts"]
# Testy z markerem `migration` wymagają Dockera (testcontainers): `make db-migration-test`
# (bramka G2). W `make test` są wyłączone, bo runnery macOS w CI nie mają Dockera.
addopts = '--strict-markers --strict-config -ra -m "not migration"'
markers = ["migration: test migracji na Postgresie w kontenerze (wymaga Dockera)"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["goatcash", "goatcash_executor"]
# Migracje sprawdza test integracyjny `make db-migration-test` (G2), nie testy jednostkowe.
omit = ["*/goatcash/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

# ---------------- import-linter: granice modułów ----------------
# Zasada (sekcja 2 Fundamentów): moduły komunikują się wyłącznie przez publiczny
# interfejs goatcash.<moduł>.api. Implementacja modułu leży w goatcash.<moduł>._impl
# i nikt spoza modułu nie może jej importować. Executor bota może używać tylko
# goatcash.bot_core.api i goatcash.common.api.
[tool.importlinter]
root_packages = ["goatcash", "goatcash_executor"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "marketdata: tylko przez goatcash.marketdata.api"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["goatcash.features", "goatcash.agents", "goatcash.fusion", "goatcash.ledger", "goatcash.ml", "goatcash.llm", "goatcash.backtest", "goatcash.alerts", "goatcash.users", "goatcash.bot_core", "goatcash.common", "goatcash_executor"]
forbidden_modules = ["goatcash.marketdata._impl"]

[[tool.importlinter.contracts]]
name = "features: tylko przez goatcash.features.api"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["goatcash.marketdata", "goatcash.agents", "goatcash.fusion", "goatcash.ledger", "goatcash.ml", "goatcash.llm", "goatcash.backtest", "goatcash.alerts", "goatcash.users", "goatcash.bot_core", "goatcash.common", "goatcash_executor"]
forbidden_modules = ["goatcash.features._impl"]

[[tool.importlinter.contracts]]
name = "agents: tylko przez goatcash.agents.api"
type = "forbidden"
allow_indirect_imports = true
