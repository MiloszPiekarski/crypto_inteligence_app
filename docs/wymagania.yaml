# Wymagania funkcjonalne (F-xx) i niefunkcjonalne (NF-xx) GoatCash (roadmapa E2).
#
# Źródło: wiersze „Rezultat”, zakres prac i bramki etapów w docs/dokumentacja/roadmapa.md
# oraz kryteria bramek w docs/dokumentacja/testy.md. Każde wymaganie ma: identyfikator,
# etap realizacji, bramkę, która je sprawdza, sposób pomiaru i próg (z liczbą).
# Kompletność sprawdza `make requirements-check` (scripts/check_requirements.py, bramka G2).
# Zmiana wymagania = PR z aktualizacją tego pliku; identyfikatorów nie używamy ponownie.
# `source: roadmapa` = próg wprost z roadmapy/testy.md; `source: doprecyzowanie` = próg
# doprecyzowany albo zmieniony względem roadmapy; wymaga `accepted: <data>` (akceptacja
# właściciela) i `note` z wyjaśnieniem, czym różni się od roadmapy (złagodzenie, zaostrzenie,
# nowa liczba). Etap bez bramki w testy.md (E17): gate: null.

functional:
  - id: F-01
    stage: E3
    title: Odtwarzalne środowisko uruchomieniowe (Terraform, Ansible, Docker Compose)
    measure: ćwiczenie odtworzenia środowiska od zera ze skryptów
    target: odtworzenie w czasie < 30 min
    gate: G3
    source: roadmapa
  - id: F-02
    stage: E3
    title: Kopie zapasowe bazy na R2 z automatycznym testem odtworzenia
    measure: cotygodniowy automatyczny test odtworzenia kopii do czystej instancji (testy.md, pipeline krok 7)
    target: 100% tabel ze zgodną liczbą wierszy i sumą kontrolną zawartości; RPO ≤ 24 h, RTO ≤ 4 h (NF-04)
    gate: G3
    source: doprecyzowanie
    accepted: 2026-11-23
    note: tygodniowy test i RPO/RTO z testy.md i NF-04; zgodność sumy kontrolnej to doprecyzowanie kryterium „udane odtworzenie kopii” z G3
  - id: F-03
    stage: E3
    title: Monitoring i alerty infrastruktury (OTel, Grafana, Better Stack)
    measure: sztuczne zapełnienie dysku i zatrzymanie kontenera (tabela testów E3, wiersz „Alerty”)
    target: powiadomienie w < 5 min dla każdego scenariusza
    gate: G3
    source: roadmapa
  - id: F-04
    stage: E4
    title: Pobieranie świec i danych pochodnych z giełd (adaptery, proces ingest, historia)
    measure: odsetek oczekiwanych świec zapisanych w bazie
    target: kompletność ≥ 99,9%
    gate: G4
    source: roadmapa
  - id: F-05
    stage: E4
    title: Data Quality Sentinel wykrywający błędne dane
    measure: dane z wstrzykniętymi błędami (luki, skoki, duplikaty)
    target: wykrycie ≥ 95% wstrzykniętych błędów
    gate: G4
    source: roadmapa
  - id: F-06
    stage: E4
    title: Cena referencyjna aktywa (mediana giełd) i ciągła praca ingestu
    measure: praca ingestu bez ręcznej interwencji
    target: 72 h bez interwencji
    gate: G4
    source: roadmapa
  - id: F-07
    stage: E5
    title: Point-in-time feature store (cechy z as_of i data_cutoff)
    measure: test wycieku informacji z przyszłości na wszystkich cechach
    target: 100% cech bez wycieku
    gate: G5
    source: roadmapa
  - id: F-08
    stage: E5
    title: Zgodność cech liczonych na żywo z powtórką historyczną
    measure: 7 dni cech na żywo porównane z odtworzeniem tych dni z historii (tabela testów E5)
    target: 0 różnic powyżej tolerancji względnej 1e-9 w okresie 7 dni
    gate: G5
    source: doprecyzowanie
    accepted: 2026-11-23
    note: jawne złagodzenie roadmapy (E5 wymaga „identycznych wartości”, bit w bit) do tolerancji względnej 1e-9 na różnice zmiennoprzecinkowe
  - id: F-09
    stage: E6
    title: API v1 zgodne ze specyfikacją OpenAPI
    measure: Schemathesis na wszystkich endpointach
    target: 0 odpowiedzi niezgodnych ze schematem, 0 błędów 500
    gate: G6
    source: roadmapa
  - id: F-10
    stage: E6
    title: Konta użytkowników (e-mail i hasło, Google, TOTP, passkeys) i role
    measure: testy E2E przepływów kont i testy autoryzacji każdego endpointu
    target: 100% przepływów przechodzi, 0 IDOR
    gate: G6
    source: roadmapa
  - id: F-11
    stage: E6
    title: Limity zapytań i dziennik audytu
    measure: seria zapytań ponad limit (k6)
    target: 429 po przekroczeniu w 100% prób
    gate: G6
    source: roadmapa
  - id: F-12
    stage: E7
    title: Agenci analityczni publikujący dowody Evidence v1
    measure: walidacja każdego dowodu kontraktem i ciągłość publikacji
    target: 100% dowodów zgodnych, 14 dni bez luk
    gate: G7
    source: roadmapa
  - id: F-13
    stage: E7
    title: Forecast Ledger rozliczający prognozy agentów
    measure: porównanie wyników Ledgera z ręcznym przeliczeniem na próbce
    target: 0 różnic na 100 losowych prognozach
    gate: G7
    source: doprecyzowanie
    accepted: 2026-11-23
    note: roadmapa (G7) wymaga zgodności Ledgera z ręcznym przeliczeniem bez wielkości próby; 100 prognoz to doprecyzowanie
  - id: F-14
    stage: E8
    title: Modele ML (kierunek i kwantyle) z rejestrem i monitoringiem dryfu
    measure: dwa treningi z tym samym hashem danych i seedem; test z cechą-pułapką zawierającą przyszły zwrot (tabela testów E8)
    target: 2 z 2 treningów dają identyczne predykcje; cecha-pułapka wykryta i odrzucona w 100% prób
    gate: G8
    source: roadmapa
  - id: F-15
    stage: E9
    title: Fuzja dowodów w ocenę aktywa z kalibracją
    measure: Brier score fuzji i najlepszego pojedynczego agenta na tym samym okresie
    target: Brier fuzji − Brier najlepszego agenta ≤ 0
    gate: G9
    source: roadmapa
  - id: F-16
    stage: E9
    title: Risk Governor z regułami weta i jawnym „nie rób nic”
    measure: testy reguł weta
    target: 100% reguł pokrytych testami
    gate: G9
    source: roadmapa
  - id: F-17
    stage: E9
    title: Indeks Gotowości 0–100 i Radar okazji
    measure: ablacje składników indeksu
    target: raport ablacji dla 100% składników
    gate: G9
    source: roadmapa
  - id: F-18
    stage: E10
    title: Narracje LLM zgodne z danymi
    measure: walidator liczb na zbiorze ewaluacyjnym narracji
    target: 0 niezgodnych liczb na 500 narracjach
    gate: G10
    source: roadmapa
  - id: F-19
    stage: E10
    title: Klasyfikator newsów i agent sentymentu
    measure: F1 na zbiorze ewaluacyjnym w porównaniu z FinBERT
    target: wynik ≥ FinBERT + 5 pp.
    gate: G10
    source: roadmapa
  - id: F-20
    stage: E10
    title: Odporność warstwy LLM na awarie dostawców
    measure: symulacja 500, timeoutu i 429 u głównego dostawcy (Toxiproxy, mock; tabela testów E10)
    target: 0 błędów u użytkownika w 3 z 3 scenariuszy (przełączenie na zapas, w ostateczności szablon)
    gate: G10
    source: roadmapa
  - id: F-21
    stage: E10a
    title: Agent Zdarzeń z weryfikacją i oceną wpływu
    measure: zdarzenia potwierdzone przez system porównane z rzeczywistością
    target: 0 fałszywych zdarzeń potwierdzonych
    gate: G10a
    source: roadmapa
  - id: F-22
    stage: E11
    title: Backtesting strategii z modelem kosztów
    measure: wyniki 5 strategii referencyjnych porównane z niezależnym przeliczeniem
    target: 5 z 5 strategii zgodnych
    gate: G11
    source: roadmapa
  - id: F-23
    stage: E11
    title: Brak zaglądania w przyszłość w silniku backtestów
    measure: strategia-pułapka używająca przyszłej ceny (tabela testów E11, G11)
    target: błąd silnika w 100% przypadków
    gate: G11
    source: roadmapa
  - id: F-24
    stage: E11a
    title: Pętla samouczenia z granicami i automatycznym powrotem
    measure: wymuszony spadek wyniku aktywnej polityki; próba zapisu limitów ryzyka z modułu learning (import-linter i użytkownik bazy bez prawa zapisu do tabel limitów)
    target: pogorszenie = spadek Sharpe po kosztach aktywnej polityki o ≥ 30% względem poprzedniej wersji w oknie kroczącym 14 dni (min. 30 transakcji); powrót w ≤ 1 cykl z alertem w 100% przypadków; 0 udanych zapisów limitów (odmowa i wpis w audycie)
    gate: G11a
    source: doprecyzowanie
    accepted: 2026-11-23
    note: liczbowa definicja „pogorszenia” (metryka, okno, próg) to doprecyzowanie; test granic i powrót w ≤ 1 cykl z roadmapy E11a
  - id: F-25
    stage: E12
    title: Aplikacja web (PL i EN, tryb ciemny i jasny, PWA) odpowiadająca na pytania z wizji
    measure: testy użyteczności z użytkownikami
    target: 5 z 5 zadań kluczowych wykonanych
    gate: G12
    source: roadmapa
  - id: F-26
    stage: E12
    title: Wydajność i jakość frontendu
    measure: Lighthouse na kluczowych widokach
    target: wynik ≥ 90 we wszystkich kategoriach
    gate: G12
    source: roadmapa
  - id: F-27
    stage: E13
    title: Alerty (e-mail, Telegram, Web Push, w aplikacji) dostarczane dokładnie raz
    measure: test dostarczeń z powtórzeniami i awarią konsumenta
    target: 0 duplikatów i 0 zgubionych, p95 dostarczenia ≤ 60 s
    gate: G13
    source: roadmapa
  - id: F-28
    stage: E14
    title: Bot w trybie paper zgodny z backtestem
    measure: porównanie wyników paper i backtestu na tym samym okresie
    target: różnica < 1%
    gate: G14a
    source: roadmapa
  - id: F-29
    stage: E14
    title: Bot na testnecie z uzgadnianiem stanu i kill switchem
    measure: 30 dni testnetu, testy chaosu, pomiar zatrzymania
    target: 0 rozbieżności przez 30 dni, kill switch ≤ 5 s
    gate: G14b
    source: roadmapa
  - id: F-30
    stage: E14
    title: Bezpieczeństwo kluczy giełd użytkowników
    measure: próby odczytu kluczy z API, logów i pamięci workera, klucz z prawem wypłat
    target: 0 udanych prób, 100% kluczy z prawem wypłat odrzuconych
    gate: G14b
    source: roadmapa
  - id: F-31
    stage: E14
    title: Bot w trybie live (zamknięta beta)
    measure: incydenty krytyczne w becie live
    target: 30 dni bez incydentu krytycznego
    gate: G14c
    source: roadmapa
  - id: F-32
    stage: E15
    title: Audyt bezpieczeństwa i ćwiczenie odtworzenia po awarii
    measure: audyt OWASP ASVS L2 i ćwiczenie DR
    target: 0 ustaleń wysokich, RTO ≤ 4 h w ćwiczeniu
    gate: G15
    source: roadmapa
  - id: F-33
    stage: E16
    title: Publiczne uruchomienie (beta, strona statusu, publiczny Ledger)
    measure: dostępność w becie i lista gotowości
    target: 30 dni bety, dostępność ≥ 99,5%, lista gotowości 100%
    gate: G16
    source: roadmapa
  - id: F-34
    stage: E17
    title: Rytm operacyjny i raport miesięczny kosztów i jakości
    measure: raporty miesięczne w repozytorium
    target: 1 raport na każdy miesiąc utrzymania
    gate: null
    source: roadmapa
  - id: F-35
    stage: E18
    title: Skaner tokenów Solana z oceną ryzyka 0–100
    measure: odczyt posiadaczy porównany z eksploratorem, kalibracja oceny
    target: zgodność na 50 tokenach, zużycie kredytów RPC < 80%
    gate: G18
    source: roadmapa
  - id: F-36
    stage: E11
    title: Ochrona przed przeuczeniem w backtestach (walk-forward, DSR, PBO)
    measure: ≥ 20 strategii dopasowanych do szumu oraz 5 strategii referencyjnych
    target: DSR/PBO oznacza 100% strategii szumowych jako przeuczone i 0 z 5 referencyjnych (brak fałszywego alarmu)
    gate: G11
    source: doprecyzowanie
    accepted: 2026-11-23
    note: wydzielone z F-23 na prośbę właściciela; roadmapa (E11, punkt 5) wymaga DSR i PBO bez progów liczbowych

# Przepisane z tabeli „Wymagania niefunkcjonalne (wyciąg)” roadmapy E2.
non_functional:
  - id: NF-01
    title: Świeżość analizy 1 h
    measure: metryka analysis_lag_seconds
    target: ≤ 3 min po zamknięciu świecy dla 95% aktywów
    gate: G15
    source: roadmapa
  - id: NF-02
    title: Czas odpowiedzi API
    measure: k6, Grafana
    target: p95 ≤ 300 ms z cache, ≤ 1 s bez cache
    gate: G15
    source: roadmapa
  - id: NF-03
    title: Dostępność
    measure: Better Stack
    target: 99,5% w becie, 99,9% po GA
    gate: G16
    source: roadmapa
  - id: NF-04
    title: Kopie zapasowe i odtworzenie
    measure: ćwiczenie odtworzenia w E15
    target: RPO 24 h w budowie, 1 h po GA; RTO 4 h
    gate: G15
    source: roadmapa
  - id: NF-05
    title: Bezpieczeństwo aplikacji
    measure: lista kontrolna OWASP ASVS w E15
    target: zgodność z ASVS poziom 2, 0 ustaleń wysokich
    gate: G15
    source: roadmapa
  - id: NF-06
    title: Dostępność UI
    measure: skan axe-core każdego widoku (Playwright)
    target: WCAG 2.2 AA, 0 naruszeń critical i 0 serious
    gate: G12
    source: roadmapa
    note: "WCAG 2.2 AA (roadmapa) wymaga też 0 serious: np. kontrast kolorów ma w axe wagę serious; testy.md ujednolicone 23.11.2026"
  - id: NF-07
    title: Opóźnienie i uzgadnianie stanu bota
    measure: metryki executora
    target: od decyzji do zlecenia ≤ 5 s; uzgadnianie stanu co 15 s
    gate: G14b
    source: roadmapa
