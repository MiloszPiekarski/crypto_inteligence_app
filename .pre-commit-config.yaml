# Lokalna warstwa 1 ochrony (sekcja 8 Fundamentów). Instalacja: make install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: ["--branch", "main"]
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
        exclude: '(^|/)tsconfig\.json$'
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      # Raporty lokalne bramek (docs/gates/G*/*.log) muszą zostać bajt w bajt takie, jak je
      # zapisał skrypt: ich SHA-256 jest w dowodzie bramki. Kontrole bezpieczeństwa (klucze,
      # gitleaks) nadal je sprawdzają; wyłączone są tylko poprawki formatu.
      - id: end-of-file-fixer
        exclude: '^docs/gates/G[^/]+/[^/]+\.log$'
      - id: trailing-whitespace
        exclude: '^docs/gates/G[^/]+/[^/]+\.log$'
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.6.8
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.6.8"]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        pass_filenames: false
  - repo: local
    hooks:
      - id: sops-encrypted
        name: pliki *.enc.yaml zaszyfrowane przez SOPS
        entry: uv run --frozen python scripts/sops_check.py
        language: system
        files: '\.enc\.yaml$'
