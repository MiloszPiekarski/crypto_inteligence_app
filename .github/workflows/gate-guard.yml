# gate-guard (zakładka Testy, sekcja 3): PR etapu jest czerwony, dopóki bramki wymagane do
# tego etapu (gates/requirements.yaml) nie mają na main sprawdzonego dowodu
# docs/gates/G<nr>.passed.json. Logika i testy: scripts/gate_guard.py.
name: gate-guard

# Bez `opened` i bez anulowania przebiegów (concurrency): `gh pr create --label` wysyła
# `opened` i `labeled` naraz, a anulowany przebieg mógł zostać uznany za wynik wymaganego
# checka i zablokować scalenie (PR #18). PR otwarty bez etykiety nie ma checka gate-guard,
# więc ruleset i tak blokuje scalenie („Expected”) do czasu dodania etykiety. Każdy przebieg
# czyta etykiety z API w chwili uruchomienia, więc równoległe przebiegi dają ten sam wynik.
#
# pull_request_target (PR 10a/10b, luka z #13): wersja workflow i skryptu zawsze z main, więc
# PR nie może podmienić kontroli, której sam podlega. Bezpieczne, bo job nie pobiera ani nie
# uruchamia kodu z PR (checkout bez `ref` = commit bazowy), ma tylko uprawnienia do odczytu
# i nie używa sekretów poza tokenem tylko do odczytu (test: scripts/tests/test_gate_guard.py).
# Zmiana wyzwalacza wymaga dwóch kroków (PR #46 dodał pull_request_target, 10b usunął
# pull_request), bo GitHub bierze workflow dla pull_request_target z main.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] uzasadnienie wyżej, test w scripts/tests
    types: [synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read # checkout i odczyt dowodów z main
  actions: read # weryfikacja przebiegu CI podanego w dowodzie
  pull-requests: read # bieżące etykiety PR (scripts/gate_guard.py, current_pr_labels)

jobs:
  gate-guard:
    name: gate-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: bramki wymagane przez etykietę etapu
        env:
          GH_TOKEN: ${{ github.token }}
        # Checkout przy pull_request_target to commit z main: skrypt, reguły bramek i dowody
        # pochodzą z main, a kod z PR nie jest pobierany ani uruchamiany.
        run: |
          git fetch --no-tags origin main
          uv run --frozen python scripts/gate_guard.py --ref origin/main
