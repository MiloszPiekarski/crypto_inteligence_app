# CI (E1.7): lint → typy → testy → gitleaks → build obrazów → skan Trivy → raport pokrycia.
# Równolegle od lintu: bramka G1 (make gate G=1, definicja w gates/G1.yaml).
# Kolejność wymuszona przez `needs`: każdy etap startuje dopiero po zielonym poprzednim.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: 1 lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - name: pre-commit (ruff, Biome, YAML, duże pliki, klucze prywatne)
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch,gitleaks-system

  types:
    name: 2 typy
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - name: pyright (strict)
        run: uv run pyright
      - name: granice modułów (import-linter)
        run: uv run lint-imports
      - name: tsc --noEmit
        run: pnpm typecheck

  test:
    name: 3 testy
    needs: types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - name: pytest + pokrycie
        run: uv run pytest --cov --cov-report=xml --cov-report=term
      - name: vitest
        run: pnpm test
      - name: next build
        run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-python
          path: coverage.xml
          retention-days: 14

  gitleaks:
    name: 4 gitleaks (pełna historia)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --config .gitleaks.toml --redact --verbose /repo

  images:
    name: 5-6 obraz ${{ matrix.service }} (build + Trivy)
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [platform, executor]
    steps:
      - uses: actions/checkout@v7
      - name: nazwa obrazu małymi literami (wymóg GHCR)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/goatcash-${{ matrix.service }}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: build linux/amd64 (do skanu)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: goatcash-${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy (0 podatności krytycznych)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: goatcash-${{ matrix.service }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: logowanie do GHCR (tylko main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build linux/arm64 + linux/amd64 (push do GHCR tylko z main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}

  coverage:
    name: 7 raport pokrycia
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage-python
      - name: podsumowanie pokrycia w zakładce Summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          line = float(root.get("line-rate", 0)) * 100
          branch = float(root.get("branch-rate", 0)) * 100
          print("## Pokrycie testami (Python)")
          print(f"| Linie | Gałęzie |\n|---|---|\n| {line:.1f}% | {branch:.1f}% |")
          PY

  gate:
    name: 8 bramka G1 (make gate G=1)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      SOPS_VERSION: 3.13.3
      SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
      AGE_VERSION: 1.3.2
      AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: gitleaks, sops, age (przypięte wersje, sprawdzone sumy SHA-256)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLo sops "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          curl -sSfLo age.tgz "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          printf '%s  gitleaks.tgz\n%s  sops\n%s  age.tgz\n' "$GITLEAKS_SHA256" "$SOPS_SHA256" "$AGE_SHA256" | sha256sum -c -
          mkdir -p bin
          tar -xzf gitleaks.tgz -C bin gitleaks
          tar -xzf age.tgz --strip-components=1 -C bin age/age age/age-keygen
          install -m 0755 sops bin/sops
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - name: make gate G=1
        run: make gate G=1
      - name: raport bramki w zakładce Summary
        if: always()
        run: |
          shopt -s nullglob
          for f in reports/gates/G1-*.log; do
            { echo '## Bramka G1'; echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-G1
          path: reports/gates/
          retention-days: 90

  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, types, test, gitleaks, images, coverage, gate]
    runs-on: ubuntu-latest
    steps:
      - name: wszystkie etapy zielone
        run: |
          echo '${{ toJSON(needs) }}' | python3 -c 'import json,sys; d=json.load(sys.stdin); bad=[k for k,v in d.items() if v["result"]!="success"]; print("czerwone:", bad) if bad else print("OK"); sys.exit(1 if bad else 0)'
