version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
  - package-ecosystem: docker
    directories: ["/services/platform", "/services/executor"]
    schedule: { interval: weekly }
    labels: [dependencies]
