# cooldown: nowa wersja zależności musi mieć co najmniej 7 dni (ochrona przed przejętymi wydaniami).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    labels: [dependencies]
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    labels: [dependencies]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    labels: [dependencies]
  - package-ecosystem: docker
    directories: ["/services/platform", "/services/executor"]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    labels: [dependencies]
