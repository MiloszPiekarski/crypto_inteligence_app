[project]
name = "goatcash-executor"
version = "0.1.0"
description = "GoatCash: odizolowany executor bota (osobny obraz, osobne sekrety)"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
dependencies = ["goatcash-platform"]

[tool.uv.sources]
goatcash-platform = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "goatcash_executor"
