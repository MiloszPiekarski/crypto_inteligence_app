# Uniwersum ścieżki pracy (roadmapa E4, punkt 3 ścieżki pracy; ADR-0008): stała lista
# 20 par spot */USDT obecnych na obu giełdach, świece 1 h od 2023-01-01 00:00 UTC.
#
# Metadane (symbol, nazwa, coingecko_id) zapisane raz, bez zapytań do CoinGecko w czasie
# działania (decyzja właściciela 26.11.2026, uproszczenie ścieżki pracy opisane w
# docs/gates/G4p.md). Źródło: CoinGecko API /coins/markets (id, symbol, name), odczyt
# 26.11.2026. Obecność par na OKX (spot, historia 1 h od 2023-01-01) sprawdzona
# 26.11.2026 zapytaniami do /api/v5/public/instruments i /api/v5/market/history-candles;
# na Bybit: sonda z serwera staging (Amsterdam) na początku PR 2 E4.
#
# Format TOML (tomllib ze standardowej biblioteki, bez dodatkowej zależności).
# Zmiana listy = zmiana zakresu danych (raport kompletności G4p liczy się z tej listy).
start = "2023-01-01T00:00:00Z"
timeframe = "1h"

[exchanges]
primary = "okx"
secondary = "bybit"

