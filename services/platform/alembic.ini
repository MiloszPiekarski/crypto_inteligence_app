# Konfiguracja Alembic (ADR-0002: jedno źródło schematu). Adres bazy tylko ze zmiennej
# GOATCASH_DATABASE_URL (sekret w .env.local / SOPS), nigdy w tym pliku.
# Uruchomienie z katalogu services/platform: uv run alembic upgrade head
[alembic]
script_location = goatcash:migrations
version_locations = goatcash:migrations/versions
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
