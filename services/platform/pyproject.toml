[project]
name = "goatcash-platform"
version = "0.1.0"
description = "GoatCash: platforma analityczna (api, worker, ingest, scheduler)"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
dependencies = [
    "alembic>=1.16",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "goatcash"
